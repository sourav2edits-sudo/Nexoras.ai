
name: Build NEXORA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXORA_AI_Creator_Edition_0_2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q NEXORA_AI_Creator_Edition_0_2.zip -d source

      - name: Build APK
        run: gradle -p source/NexoraAI :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-APK
          path: source/NexoraAI/app/build/outputs/apk/debug/app-debug.apk
          
